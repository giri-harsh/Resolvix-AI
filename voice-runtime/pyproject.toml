[project]
name = "resolvix-runtime"
version = "1.0.0"
description = "Resolvix Member A: Voice Runtime and Integration"
requires-python = ">=3.11"
dependencies = [
    "resolvix-contracts",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
outbound = [
    "websockets>=12",   # uvicorn needs a WebSocket library to serve /ws/exotel/{token}
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["resolvix_runtime*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
